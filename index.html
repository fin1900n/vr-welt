<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Hand Tracking VR</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        /* STEREO CONTAINER */
        #stereo-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        .eye-view {
            width: 50vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            border-right: 2px solid #000;
        }

        .eye-view:last-child {
            border-right: none;
            border-left: 2px solid #000;
        }

        /* VIDEO in jeder Hälfte */
        .eye-view video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Canvas für Hand-Overlay */
        .eye-view canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Objekte in jeder Hälfte */
        .eye-objects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .object3d {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
        }

        .obj1 { background: #ff6b6b; }
        .obj2 { background: #4ecdc4; }
        .obj3 { background: #ffe66d; }

        /* Cursor in jeder Hälfte */
        .cursor {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px white;
        }

        .cursor.pinch {
            background: rgba(0, 255, 0, 0.6);
            transform: translate(-50%, -50%) scale(0.7);
        }

        /* Trennlinie in der Mitte */
        #divider {
            position: fixed;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100vh;
            background: #000;
            z-index: 1000;
        }

        /* Status oben Mitte */
        #status {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            z-index: 1001;
            font-size: 12px;
        }

        /* UI Elemente */
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #ui.hidden {
            display: none;
        }

        #ui h1 {
            color: white;
            margin-bottom: 15px;
            font-size: 22px;
        }

        #ui p {
            color: #888;
            margin-bottom: 25px;
            text-align: center;
            padding: 0 30px;
            font-size: 14px;
        }

        #startBtn {
            padding: 15px 40px;
            font-size: 18px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Vollbild-Hinweis */
        #fullscreen-hint {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 10px;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <!-- Start UI -->
    <div id="ui">
        <h1>VR Hand Tracking</h1>
        <p>Halte deine Hand vor die Kamera.<br>Pinch-Geste zum Greifen.<br>Dann Handy in VR-Brille einsetzen.</p>
        <button id="startBtn">Starten</button>
    </div>

    <!-- Stereo View (Links + Rechts) -->
    <div id="stereo-container" style="display:none;">
        <!-- Linkes Auge -->
        <div class="eye-view" id="left-eye">
            <video id="video-left" playsinline muted></video>
            <canvas id="canvas-left"></canvas>
            <div class="eye-objects" id="objects-left"></div>
            <div class="cursor" id="cursor-left" style="display:none;"></div>
        </div>

        <!-- Rechtes Auge -->
        <div class="eye-view" id="right-eye">
            <video id="video-right" playsinline muted></video>
            <canvas id="canvas-right"></canvas>
            <div class="eye-objects" id="objects-right"></div>
            <div class="cursor" id="cursor-right" style="display:none;"></div>
        </div>
    </div>

    <!-- Trennlinie -->
    <div id="divider" style="display:none;"></div>

    <!-- Status -->
    <div id="status" style="display:none;">Suche Hand...</div>

    <!-- Vollbild Hinweis -->
    <div id="fullscreen-hint" style="display:none;">Für VR: Handy quer halten</div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // Elemente
        const ui = document.getElementById('ui');
        const stereoContainer = document.getElementById('stereo-container');
        const divider = document.getElementById('divider');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const fullscreenHint = document.getElementById('fullscreen-hint');

        // Video Elemente (beide zeigen den gleichen Stream)
        const videoLeft = document.getElementById('video-left');
        const videoRight = document.getElementById('video-right');

        // Canvas
        const canvasLeft = document.getElementById('canvas-left');
        const canvasRight = document.getElementById('canvas-right');
        const ctxLeft = canvasLeft.getContext('2d');
        const ctxRight = canvasRight.getContext('2d');

        // Cursor
        const cursorLeft = document.getElementById('cursor-left');
        const cursorRight = document.getElementById('cursor-right');

        // Objekt-Container
        const objectsLeft = document.getElementById('objects-left');
        const objectsRight = document.getElementById('objects-right');

        // State
        let hands;
        let stream;
        let grabbedIndex = -1;
        let lastPinch = false;

        // Objekte Positionen (in Prozent)
        const objectsData = [
            { x: 30, y: 35, class: 'obj1' },
            { x: 50, y: 35, class: 'obj2' },
            { x: 70, y: 35, class: 'obj3' }
        ];

        // Objekte erstellen
        function createObjects() {
            [objectsLeft, objectsRight].forEach(container => {
                container.innerHTML = '';
                objectsData.forEach((obj, i) => {
                    const div = document.createElement('div');
                    div.className = `object3d ${obj.class}`;
                    div.id = `obj-${container.id}-${i}`;
                    div.style.left = obj.x + '%';
                    div.style.top = obj.y + '%';
                    container.appendChild(div);
                });
            });
        }

        // Objekte synchronisieren (beide Seiten gleich)
        function updateObjects() {
            objectsData.forEach((obj, i) => {
                const leftObj = document.getElementById(`obj-objects-left-${i}`);
                const rightObj = document.getElementById(`obj-objects-right-${i}`);
                if (leftObj && rightObj) {
                    leftObj.style.left = obj.x + '%';
                    leftObj.style.top = obj.y + '%';
                    rightObj.style.left = obj.x + '%';
                    rightObj.style.top = obj.y + '%';

                    // Highlight wenn gegriffen
                    const shadow = grabbedIndex === i ? '0 0 25px white' : '0 0 15px rgba(255,255,255,0.4)';
                    leftObj.style.boxShadow = shadow;
                    rightObj.style.boxShadow = shadow;
                }
            });
        }

        // Start
        startBtn.addEventListener('click', async () => {
            startBtn.textContent = 'Lädt...';
            startBtn.disabled = true;

            try {
                // Vollbild versuchen
                try {
                    await document.documentElement.requestFullscreen();
                    screen.orientation.lock('landscape').catch(() => {});
                } catch (e) {}

                await startCamera();
                await startHandTracking();

                // UI umschalten
                ui.classList.add('hidden');
                stereoContainer.style.display = 'flex';
                divider.style.display = 'block';
                status.style.display = 'block';
                fullscreenHint.style.display = 'block';
                cursorLeft.style.display = 'block';
                cursorRight.style.display = 'block';

                createObjects();
                resizeCanvases();

            } catch (err) {
                alert('Fehler: ' + err.message);
                startBtn.textContent = 'Nochmal';
                startBtn.disabled = false;
            }
        });

        // Canvas Größe anpassen
        function resizeCanvases() {
            const w = window.innerWidth / 2;
            const h = window.innerHeight;
            canvasLeft.width = w;
            canvasLeft.height = h;
            canvasRight.width = w;
            canvasRight.height = h;
        }
        window.addEventListener('resize', resizeCanvases);

        // Kamera starten
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
            } catch (e) {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            }

            // Beide Videos mit gleichem Stream
            videoLeft.srcObject = stream;
            videoRight.srcObject = stream;

            await Promise.all([
                videoLeft.play(),
                videoRight.play()
            ]);
        }

        // Hand Tracking
        async function startHandTracking() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            // Detection Loop
            async function detect() {
                if (videoLeft.readyState >= 2) {
                    await hands.send({ image: videoLeft });
                }
                requestAnimationFrame(detect);
            }
            detect();
        }

        // Ergebnisse verarbeiten
        function onResults(results) {
            // Canvas leeren
            ctxLeft.clearRect(0, 0, canvasLeft.width, canvasLeft.height);
            ctxRight.clearRect(0, 0, canvasRight.width, canvasRight.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                status.textContent = 'Hand erkannt!';
                status.style.background = 'rgba(0,150,0,0.8)';

                // Hand auf beiden Canvases zeichnen
                drawHand(ctxLeft, canvasLeft, landmarks);
                drawHand(ctxRight, canvasRight, landmarks);

                // Zeigefinger + Daumen
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // Cursor Position (in Prozent)
                const xPercent = indexTip.x * 100;
                const yPercent = indexTip.y * 100;

                // Cursor auf beiden Seiten
                cursorLeft.style.left = xPercent + '%';
                cursorLeft.style.top = yPercent + '%';
                cursorRight.style.left = xPercent + '%';
                cursorRight.style.top = yPercent + '%';

                // Pinch erkennen
                const dist = Math.hypot(
                    indexTip.x - thumbTip.x,
                    indexTip.y - thumbTip.y,
                    indexTip.z - thumbTip.z
                );
                const isPinch = dist < 0.06;

                // Cursor Stil
                [cursorLeft, cursorRight].forEach(c => {
                    c.classList.toggle('pinch', isPinch);
                });

                // Objekt greifen
                if (isPinch && !lastPinch && grabbedIndex === -1) {
                    objectsData.forEach((obj, i) => {
                        const dx = xPercent - obj.x;
                        const dy = yPercent - obj.y;
                        const distance = Math.hypot(dx, dy);
                        if (distance < 15) {
                            grabbedIndex = i;
                        }
                    });
                }

                // Objekt loslassen
                if (!isPinch && lastPinch && grabbedIndex !== -1) {
                    grabbedIndex = -1;
                }

                // Objekt bewegen
                if (grabbedIndex !== -1 && isPinch) {
                    objectsData[grabbedIndex].x = xPercent;
                    objectsData[grabbedIndex].y = yPercent;
                }

                updateObjects();
                lastPinch = isPinch;

            } else {
                status.textContent = 'Suche Hand...';
                status.style.background = 'rgba(0,0,0,0.8)';
            }
        }

        // Hand zeichnen
        function drawHand(ctx, canvas, landmarks) {
            const w = canvas.width;
            const h = canvas.height;

            // Verbindungen
            const connections = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],
                [0,17],[17,18],[18,19],[19,20],
                [5,9],[9,13],[13,17]
            ];

            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;

            connections.forEach(([i, j]) => {
                ctx.beginPath();
                ctx.moveTo(landmarks[i].x * w, landmarks[i].y * h);
                ctx.lineTo(landmarks[j].x * w, landmarks[j].y * h);
                ctx.stroke();
            });

            // Fingerspitzen
            ctx.fillStyle = 'white';
            [4, 8, 12, 16, 20].forEach(i => {
                ctx.beginPath();
                ctx.arc(landmarks[i].x * w, landmarks[i].y * h, 6, 0, Math.PI * 2);
                ctx.fill();
            });
        }
    </script>
</body>
</html>
