<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hand Tracking</title>

    <!-- A-Frame für 3D -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MediaPipe für Handerkennung -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }

        /* Vollbild Kamera (Passthrough) */
        #camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Hand-Overlay Canvas */
        #hand-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* 3D Szene (transparent über Kamera) */
        #vr-scene {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10 !important;
        }

        .a-canvas {
            background: transparent !important;
        }

        /* Dezentes Status-Display (Vision Pro Style) */
        #status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
        }

        #status-dot.active {
            background: #30d158;
            box-shadow: 0 0 10px #30d158;
        }

        /* Gesten-Anzeige unten */
        #gesture-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 0.3s;
        }

        #gesture-indicator.visible {
            opacity: 1;
        }

        /* Startscreen */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1c1c1e 0%, #000 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        #start-screen.hidden {
            display: none !important;
        }

        #start-screen h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }

        #start-screen p {
            color: #86868b;
            font-size: 16px;
            margin-bottom: 40px;
            text-align: center;
            max-width: 300px;
            line-height: 1.5;
        }

        #start-btn {
            padding: 16px 32px;
            font-size: 17px;
            background: #0a84ff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            font-weight: 600;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s, background 0.2s;
        }

        #start-btn:active {
            transform: scale(0.96);
            background: #0071e3;
        }

        .hidden {
            display: none !important;
        }

        /* Hand-Punkte Styling */
        .hand-landmark {
            position: absolute;
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }

        /* Fingerspitzen-Cursor */
        #finger-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
            transition: transform 0.1s, border-color 0.2s;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #finger-cursor.pinch {
            transform: translate(-50%, -50%) scale(0.6);
            background: rgba(48, 209, 88, 0.8);
            border-color: #30d158;
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <h1>AR Hand Tracking</h1>
        <p>Halte deine Hand vor die Kamera um virtuelle Objekte zu steuern. Pinch-Geste zum Greifen.</p>
        <button id="start-btn" onclick="startApp()">Starten</button>
    </div>

    <!-- Kamera (Passthrough) -->
    <div id="camera-container" class="hidden">
        <video id="camera-feed" playsinline></video>
    </div>

    <!-- Hand Overlay -->
    <canvas id="hand-canvas" class="hidden"></canvas>

    <!-- Finger Cursor -->
    <div id="finger-cursor" class="hidden"></div>

    <!-- Status Bar (oben) -->
    <div id="status-bar" class="hidden">
        <div id="status-dot"></div>
        <span id="status-text">Suche Hand...</span>
    </div>

    <!-- Gesten Anzeige (unten) -->
    <div id="gesture-indicator" class="hidden">
        <span id="gesture-text"></span>
    </div>

    <!-- A-Frame 3D Szene (transparent) -->
    <a-scene id="vr-scene" class="hidden" embedded
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: true"
             background="color: transparent"
             renderer="alpha: true; antialias: true; colorManagement: true">

        <!-- Interaktive Objekte - schweben in der Luft -->
        <a-box id="obj-cube" position="-0.4 0 -1.5" scale="0.15 0.15 0.15"
               color="#ff6b6b" class="interactive"
               animation__float="property: position; to: -0.4 0.05 -1.5; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
        </a-box>

        <a-sphere id="obj-sphere" position="0 0 -1.5" radius="0.08"
                  color="#4ecdc4" class="interactive"
                  animation__float="property: position; to: 0 0.05 -1.5; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine">
        </a-sphere>

        <a-dodecahedron id="obj-dodeca" position="0.4 0 -1.5" radius="0.08"
                        color="#ffe66d" class="interactive"
                        animation__float="property: position; to: 0.4 0.05 -1.5; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine"
                        animation__rotate="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear">
        </a-dodecahedron>

        <!-- 3D Cursor (folgt der Hand in 3D) -->
        <a-entity id="hand-cursor-3d">
            <a-sphere id="cursor-3d" radius="0.02" color="#ffffff" opacity="0.8"
                      material="shader: flat"></a-sphere>
        </a-entity>

        <!-- Licht -->
        <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
        <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>

        <!-- Kamera (keine Bewegung, fixiert) -->
        <a-camera id="main-camera" position="0 0 0"
                  look-controls="enabled: false"
                  wasd-controls="enabled: false">
        </a-camera>

    </a-scene>

    <script src="vr-hand-tracking.js"></script>
</body>
</html>
