<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VR Welt</title>
    <meta name="description" content="VR Welt für Smartphone">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            cursor: pointer;
        }

        #start-overlay h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        #start-overlay p {
            font-size: 20px;
            margin: 10px 20px;
        }

        #start-overlay .tap-icon {
            font-size: 80px;
            margin: 30px 0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="start-overlay">
        <h1>VR Welt</h1>
        <div class="tap-icon">👆</div>
        <p><b>Tippe irgendwo</b> um zu starten</p>
        <p>Dann Handy in VR-Brille stecken</p>
    </div>

    <a-scene
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        renderer="antialias: true">

        <!-- Himmel -->
        <a-sky color="#87CEEB"></a-sky>

        <!-- Boden -->
        <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="100"
            height="100"
            color="#567d46">
        </a-plane>

        <!-- Sonne -->
        <a-sphere
            position="20 30 -30"
            radius="5"
            color="#FFD700"
            material="emissive: #FFD700; emissiveIntensity: 0.5">
        </a-sphere>

        <!-- Rote Box -->
        <a-box
            position="-2 1 -5"
            rotation="0 45 0"
            color="#EF2D5E">
        </a-box>

        <!-- Blaue Kugel -->
        <a-sphere
            position="0 1.5 -6"
            radius="1"
            color="#3498db">
        </a-sphere>

        <!-- Grüner Zylinder -->
        <a-cylinder
            position="2 1 -5"
            radius="0.5"
            height="2"
            color="#2ecc71">
        </a-cylinder>

        <!-- Gelber Kegel -->
        <a-cone
            position="-3 1 -8"
            radius-bottom="1"
            radius-top="0"
            height="2"
            color="#f1c40f">
        </a-cone>

        <!-- Violetter Torus -->
        <a-torus
            position="3 2 -8"
            radius="1"
            radius-tubular="0.2"
            color="#9b59b6"
            rotation="45 45 0">
        </a-torus>

        <!-- Bäume -->
        <a-cylinder position="-8 1.5 -10" radius="0.3" height="3" color="#8B4513"></a-cylinder>
        <a-cone position="-8 4 -10" radius-bottom="2" height="4" color="#228B22"></a-cone>

        <a-cylinder position="8 1.5 -12" radius="0.3" height="3" color="#8B4513"></a-cylinder>
        <a-cone position="8 4 -12" radius-bottom="2" height="4" color="#228B22"></a-cone>

        <a-cylinder position="5 1.5 -15" radius="0.3" height="3" color="#8B4513"></a-cylinder>
        <a-cone position="5 4 -15" radius-bottom="2" height="4" color="#228B22"></a-cone>

        <a-cylinder position="-6 1.5 -18" radius="0.3" height="3" color="#8B4513"></a-cylinder>
        <a-cone position="-6 4 -18" radius-bottom="2" height="4" color="#228B22"></a-cone>

        <!-- Wolken -->
        <a-sphere position="-10 15 -25" radius="3" color="#ffffff" opacity="0.8"></a-sphere>
        <a-sphere position="-7 15 -25" radius="2.5" color="#ffffff" opacity="0.8"></a-sphere>
        <a-sphere position="-13 15 -25" radius="2" color="#ffffff" opacity="0.8"></a-sphere>

        <a-sphere position="12 18 -30" radius="3.5" color="#ffffff" opacity="0.8"></a-sphere>
        <a-sphere position="15 18 -30" radius="2.5" color="#ffffff" opacity="0.8"></a-sphere>
        <a-sphere position="9 17 -30" radius="2" color="#ffffff" opacity="0.8"></a-sphere>

        <!-- Schwebendes Objekt mit Animation -->
        <a-dodecahedron
            position="0 3 -10"
            radius="0.8"
            color="#e74c3c"
            animation="property: rotation; to: 360 360 0; loop: true; dur: 5000; easing: linear"
            animation__float="property: position; to: 0 4 -10; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
        </a-dodecahedron>

        <!-- Beleuchtung -->
        <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
        <a-light type="directional" position="5 10 5" intensity="0.8"></a-light>

        <!-- Kamera -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: false">
            </a-camera>
        </a-entity>
    </a-scene>

    <script>
        const overlay = document.getElementById('start-overlay');
        const scene = document.querySelector('a-scene');

        async function startVR() {
            // iOS Berechtigung für Sensoren
            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    await DeviceMotionEvent.requestPermission();
                } catch (e) {
                    console.log('Sensor permission error:', e);
                }
            }

            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                } catch (e) {
                    console.log('Orientation permission error:', e);
                }
            }

            // Overlay verstecken
            overlay.classList.add('hidden');

            // VR-Modus starten
            scene.enterVR();
        }

        // Bei Klick/Touch starten
        overlay.addEventListener('click', startVR);
        overlay.addEventListener('touchend', function(e) {
            e.preventDefault();
            startVR();
        });
    </script>
</body>
</html>
