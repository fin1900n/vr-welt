<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Hand Tracking</title>

    <!-- A-Frame für VR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MediaPipe für Handerkennung -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #camera-container {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 200px;
            height: 150px;
            z-index: 1000;
            border: 3px solid #00ff00;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #hand-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        #info-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
        }

        #info-panel h3 {
            margin-bottom: 10px;
            color: #00ff00;
        }

        #status {
            color: #ffcc00;
            margin-bottom: 10px;
        }

        #gesture-display {
            font-size: 24px;
            color: #00ffff;
            margin-top: 10px;
        }

        #start-btn {
            padding: 20px 40px;
            font-size: 20px;
            background: #00ff00;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #start-btn:hover, #start-btn:active {
            background: #00cc00;
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
            pointer-events: none !important;
        }

        /* Startscreen über alles */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #start-screen.hidden {
            display: none !important;
        }

        #start-screen h1 {
            color: #00ff00;
            margin-bottom: 20px;
            text-align: center;
        }

        #start-screen p {
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        #instructions {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Start Screen (überdeckt alles bis zum Start) -->
    <div id="start-screen">
        <h1>VR Hand Tracking</h1>
        <p>Steuere VR-Objekte mit deinen Händen</p>
        <button id="start-btn">Kamera & VR Starten</button>
    </div>

    <!-- Info Panel -->
    <div id="info-panel" class="hidden">
        <h3>VR Hand Tracking</h3>
        <div id="status">Initialisiere...</div>
        <div id="gesture-display">Geste: -</div>
        <div id="hand-info"></div>
    </div>

    <!-- Kamera Feed mit Hand-Overlay -->
    <div id="camera-container" class="hidden">
        <video id="camera-feed" playsinline></video>
        <canvas id="hand-canvas"></canvas>
    </div>

    <!-- Anleitung -->
    <div id="instructions" class="hidden">
        <strong>Gesten:</strong><br>
        - Faust = Objekt greifen<br>
        - Offene Hand = Loslassen<br>
        - Zeigefinger = Zeigen/Auswählen<br>
        - Handy drehen für VR-Blick
    </div>

    <!-- A-Frame VR Szene -->
    <a-scene id="vr-scene" class="hidden" embedded
             vr-mode-ui="enabled: true"
             device-orientation-permission-ui="enabled: true">

        <!-- Assets -->
        <a-assets>
            <img id="sky-texture" src="https://cdn.aframe.io/a-painter/images/sky.jpg">
            <img id="floor-texture" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
        </a-assets>

        <!-- Himmel -->
        <a-sky src="#sky-texture" rotation="0 -90 0"></a-sky>

        <!-- Boden -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20"
                 color="#4a4a4a" shadow="receive: true"></a-plane>

        <!-- Interaktive Objekte -->
        <a-box id="red-cube" position="-1 1.5 -3" color="#ff4444"
               class="interactive" shadow="cast: true"
               animation__hover="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents: hover-start"
               animation__unhover="property: scale; to: 1 1 1; dur: 200; startEvents: hover-end">
        </a-box>

        <a-sphere id="blue-sphere" position="1 1.5 -3" radius="0.5" color="#4444ff"
                  class="interactive" shadow="cast: true"
                  animation__hover="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents: hover-start"
                  animation__unhover="property: scale; to: 1 1 1; dur: 200; startEvents: hover-end">
        </a-sphere>

        <a-cylinder id="green-cylinder" position="0 1 -4" radius="0.4" height="1.5" color="#44ff44"
                    class="interactive" shadow="cast: true"
                    animation__hover="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents: hover-start"
                    animation__unhover="property: scale; to: 1 1 1; dur: 200; startEvents: hover-end">
        </a-cylinder>

        <a-torus id="yellow-torus" position="0 2.5 -3" color="#ffff44" radius="0.4" radius-tubular="0.1"
                 class="interactive" shadow="cast: true"
                 animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
        </a-torus>

        <!-- Hand-Cursor (wird durch Handerkennung gesteuert) -->
        <a-entity id="hand-cursor">
            <a-sphere id="cursor-sphere" radius="0.05" color="#00ff00" opacity="0.8"
                      position="0 1.5 -1"></a-sphere>
            <a-text id="cursor-label" value="" position="0 1.7 -1" align="center"
                    color="#ffffff" scale="0.5 0.5 0.5"></a-text>
        </a-entity>

        <!-- Lichtquellen -->
        <a-light type="ambient" color="#404040"></a-light>
        <a-light type="directional" position="2 4 1" intensity="0.8"
                 cast-shadow="true" shadow-map-height="2048" shadow-map-width="2048">
        </a-light>

        <!-- Kamera -->
        <a-entity id="camera-rig" position="0 1.6 0">
            <a-camera id="main-camera" look-controls="enabled: true; magicWindowTrackingEnabled: true"
                      wasd-controls="enabled: false">
            </a-camera>
        </a-entity>

    </a-scene>

    <script src="vr-hand-tracking.js"></script>
</body>
</html>
