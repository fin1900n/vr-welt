<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Hand Tracking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        /* VIDEO - Vollbild Hintergrund */
        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Canvas für Hand-Tracking */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* UI Elemente */
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.9);
        }

        #ui.hidden {
            display: none;
        }

        #ui h1 {
            color: white;
            margin-bottom: 20px;
        }

        #ui p {
            color: #888;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        #startBtn {
            padding: 15px 40px;
            font-size: 18px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 50;
            font-size: 14px;
        }

        /* 3D Objekte (einfache divs) */
        .object3d {
            position: fixed;
            width: 60px;
            height: 60px;
            border-radius: 10px;
            z-index: 10;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        #obj1 { background: #ff6b6b; top: 30%; left: 30%; }
        #obj2 { background: #4ecdc4; top: 30%; left: 50%; }
        #obj3 { background: #ffe66d; top: 30%; left: 70%; }

        /* Hand Cursor */
        #cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 3px solid white;
            border-radius: 50%;
            z-index: 20;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 15px white;
            transition: transform 0.05s;
        }

        #cursor.pinch {
            background: rgba(0, 255, 0, 0.5);
            transform: translate(-50%, -50%) scale(0.7);
        }
    </style>
</head>
<body>
    <!-- Start UI -->
    <div id="ui">
        <h1>AR Hand Tracking</h1>
        <p>Halte deine Hand vor die Rückkamera.<br>Pinch-Geste (Daumen+Zeigefinger) zum Greifen.</p>
        <button id="startBtn">Kamera starten</button>
    </div>

    <!-- Video (Kamerabild) -->
    <video id="video" playsinline muted autoplay></video>

    <!-- Canvas für Hand-Overlay -->
    <canvas id="canvas"></canvas>

    <!-- Status -->
    <div id="status" style="display:none;">Suche Hand...</div>

    <!-- Cursor -->
    <div id="cursor" style="display:none;"></div>

    <!-- 3D Objekte -->
    <div id="obj1" class="object3d" style="display:none;"></div>
    <div id="obj2" class="object3d" style="display:none;"></div>
    <div id="obj3" class="object3d" style="display:none;"></div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const status = document.getElementById('status');
        const cursor = document.getElementById('cursor');
        const startBtn = document.getElementById('startBtn');
        const objects = [
            document.getElementById('obj1'),
            document.getElementById('obj2'),
            document.getElementById('obj3')
        ];

        let hands;
        let grabbedObject = null;
        let lastPinch = false;

        // Start Button
        startBtn.addEventListener('click', async () => {
            startBtn.textContent = 'Lädt...';
            startBtn.disabled = true;

            try {
                await startCamera();
                await startHandTracking();

                // UI verstecken, Elemente zeigen
                ui.classList.add('hidden');
                status.style.display = 'block';
                cursor.style.display = 'block';
                objects.forEach(o => o.style.display = 'block');

            } catch (err) {
                alert('Fehler: ' + err.message);
                startBtn.textContent = 'Nochmal';
                startBtn.disabled = false;
            }
        });

        // Kamera starten
        async function startCamera() {
            // Versuche Rückkamera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                console.log('Rückkamera gestartet');
            } catch (e) {
                console.log('Rückkamera failed, versuche andere:', e);
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            }

            // Canvas Größe
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Hand Tracking starten
        async function startHandTracking() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            // Kamera-Loop
            async function detect() {
                await hands.send({ image: video });
                requestAnimationFrame(detect);
            }
            detect();
        }

        // Hand Ergebnisse
        function onResults(results) {
            // Canvas leeren
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                status.textContent = 'Hand erkannt!';
                status.style.background = 'rgba(0,200,0,0.7)';

                // Hand zeichnen
                drawHand(landmarks);

                // Zeigefinger + Daumen
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // Cursor Position
                const x = indexTip.x * window.innerWidth;
                const y = indexTip.y * window.innerHeight;
                cursor.style.left = x + 'px';
                cursor.style.top = y + 'px';

                // Pinch erkennen
                const dist = Math.hypot(
                    indexTip.x - thumbTip.x,
                    indexTip.y - thumbTip.y,
                    indexTip.z - thumbTip.z
                );
                const isPinch = dist < 0.06;

                if (isPinch) {
                    cursor.classList.add('pinch');
                } else {
                    cursor.classList.remove('pinch');
                }

                // Objekt greifen
                if (isPinch && !lastPinch && !grabbedObject) {
                    objects.forEach(obj => {
                        const rect = obj.getBoundingClientRect();
                        const objX = rect.left + rect.width / 2;
                        const objY = rect.top + rect.height / 2;
                        const distance = Math.hypot(x - objX, y - objY);

                        if (distance < 80) {
                            grabbedObject = obj;
                            obj.style.boxShadow = '0 0 30px white';
                        }
                    });
                }

                // Objekt loslassen
                if (!isPinch && lastPinch && grabbedObject) {
                    grabbedObject.style.boxShadow = '0 0 20px rgba(255,255,255,0.3)';
                    grabbedObject = null;
                }

                // Objekt bewegen
                if (grabbedObject && isPinch) {
                    grabbedObject.style.left = x + 'px';
                    grabbedObject.style.top = y + 'px';
                }

                lastPinch = isPinch;

            } else {
                status.textContent = 'Suche Hand...';
                status.style.background = 'rgba(0,0,0,0.7)';
            }
        }

        // Hand zeichnen
        function drawHand(landmarks) {
            const w = canvas.width;
            const h = canvas.height;

            // Verbindungen
            const connections = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],
                [0,17],[17,18],[18,19],[19,20],
                [5,9],[9,13],[13,17]
            ];

            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;

            connections.forEach(([i, j]) => {
                ctx.beginPath();
                ctx.moveTo(landmarks[i].x * w, landmarks[i].y * h);
                ctx.lineTo(landmarks[j].x * w, landmarks[j].y * h);
                ctx.stroke();
            });

            // Fingerspitzen
            [4, 8, 12, 16, 20].forEach(i => {
                ctx.beginPath();
                ctx.arc(landmarks[i].x * w, landmarks[i].y * h, 8, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
            });
        }
    </script>
</body>
</html>
